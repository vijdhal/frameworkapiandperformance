# Per-environment endpoint configuration.
#
# baseUrl        fallback when a row leaves the `service` column empty. Kept on
#                reqres.in so the offline example suite resolves without a network.
# services       named endpoint groups a row selects via its `service` column,
#                resolved by Config.getServiceUrl(row.service).
#
# Every env exposes:
#   generic                     reqres.in fallback for the example suite
#   internal / external         example of a gateway with two endpoint TYPES
#                                (swap in your own client's real hosts per env)
#   mulesoft / salesforce       retained from the original framework so existing
#                               rows with service=mulesoft or =salesforce resolve
#
# A row picks a gateway TYPE with service=internal or service=external; the
# Excel `endpoint` column supplies the path, e.g.
#   service=internal  endpoint=/example/apiv2  (env sit)
#     -> https://gateway-internal.nonprod.yourcompany.com/rb/sit/example/apiv2
#
# The environment (dev/sit/uat/prod) is chosen at run time (ENVIRONMENT / ENV).
# CI can override any service per env with SERVICE_URL_<NAME>.
#
# NOTE: replace the placeholder hosts below with your own client's real gateway
# hosts before pointing this at a live environment.

dev:
  baseUrl: https://reqres.in
  services:
    generic:     https://reqres.in
    internal:    https://gateway-internal.nonprod.yourcompany.com/rb/dev
    external:    https://gateway-external.nonprod.yourcompany.com/rb/dev
    mulesoft:    https://mulesoft-dev.yourcompany.com
    salesforce:  https://login.salesforce.com

sit:
  baseUrl: https://reqres.in
  services:
    generic:     https://reqres.in
    internal:    https://gateway-internal.nonprod.yourcompany.com/rb/sit
    external:    https://gateway-external.nonprod.yourcompany.com/rb/sit
    mulesoft:    https://mulesoft-sit.yourcompany.com
    salesforce:  https://login.salesforce.com

uat:
  baseUrl: https://reqres.in
  services:
    generic:     https://reqres.in
    internal:    https://gateway-internal.nonprod.yourcompany.com/rb/uat
    external:    https://gateway-external.nonprod.yourcompany.com/rb/uat
    mulesoft:    https://mulesoft-uat.yourcompany.com
    salesforce:  https://login.salesforce.com

prod:
  baseUrl: https://reqres.in
  services:
    generic:     https://reqres.in
    internal:    https://gateway-internal.nonprod.yourcompany.com/rb/prod
    external:    https://gateway-external.nonprod.yourcompany.com/rb/prod
    mulesoft:    https://mulesoft-prod.yourcompany.com
    salesforce:  https://login.salesforce.com

# Retained for the offline example suite and back-compat (as the original main).
qa:
  baseUrl: https://reqres.in
  services:
    generic:     https://reqres.in
    mulesoft:    https://mulesoft-qa.yourcompany.com
    salesforce:  https://login.salesforce.com
